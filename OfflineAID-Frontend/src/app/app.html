    Offline<span>AID</span>

}

      <app-crear-emergencia></app-crear-emergencia>

    <!-- Columna Derecha: Listado -->
    <div class="col-md-7">
      <app-lista-emergencias></app-lista-emergencias>

  </div>
</div>
